# Tag v* builds one disk image and publishes it as a Release on this repo,
# which is what the in-app update check reads. One package covers macOS 15 and later.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "tag must be v plus dotted numbers, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Info.plist
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Build the release
        run: ./build.sh --release --no-install

      - name: Disk images
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          make_dmg() {
            local name="$1" src="$2"
            rm -rf "$stage/$name"
            mkdir -p "$stage/$name"
            cp -R "$src" "$stage/$name/Korgino.app"
            ln -s /Applications "$stage/$name/Applications"
            hdiutil create -volname "Korgino" -srcfolder "$stage/$name" \
              -ov -format UDZO "dist/$name.dmg"
          }
          make_dmg "Korgino-${version}" dist/Korgino.app
          rm -rf "$stage"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          macOS 15 or later: Korgino-${version}.dmg

          Unlocks Pro until 2026-12-31. Signed ad-hoc; not notarized.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            "dist/Korgino-${version}.dmg"
          rm -f "$notes"
